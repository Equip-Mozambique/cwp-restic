# A repository on another machine, reached over SSH: a storage box, a NAS,
# another server. To use: copy to /etc/cwp-restic/repos/offsite.conf — the file
# name is the name of the repository — then run: cwp-restic apply
#
# root must reach the host without being asked anything. Put the host name,
# port, user and key in /root/.ssh/config under a short name ("backup-host"
# here) and connect once by hand to accept the host key:  ssh backup-host
REPOSITORY=sftp:backup-host:restic/web1

# When it runs (a systemd calendar time). Empty = only by hand.
SCHEDULE=*-*-* 03:00:00

# Upload speed limit in KiB/s. Empty = no limit.
#LIMIT_UPLOAD_KB=2000

# The admin page calls the repository "Late" when its newest backup is older
# than this many days (0 = never).
#LATE_DAYS=2
