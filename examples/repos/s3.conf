# A repository in S3 or any S3-compatible storage. To use: copy to
# /etc/cwp-restic/repos/s3.conf and s3.env next to it, then run: cwp-restic apply
#
# REPOSITORY is handed to restic as it is, so every kind of storage restic
# knows works the same way (b2:, azure:, gs:, rest:, rclone:, ...); what that
# storage needs in the environment goes in the .env file.
REPOSITORY=s3:https://s3.eu-central-1.amazonaws.com/my-bucket/web1
SCHEDULE=*-*-* 03:00:00
