# A repository on a second disk in the same server: quick to restore from, but
# gone with the server, so pair it with one that is somewhere else. To use:
# copy to /etc/cwp-restic/repos/local.conf, then run: cwp-restic apply
REPOSITORY=/backup/restic
SCHEDULE=*-*-* 01:30:00

# The disk the repository is on. When it is not mounted the backup is refused,
# instead of filling the system disk.
MOUNT=/backup
